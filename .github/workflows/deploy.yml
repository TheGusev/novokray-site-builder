name: Deploy dez-federation

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DADATA_API_KEY: ${{ secrets.DADATA_API_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TELEGRAM_BOT_TOKEN,DADATA_API_KEY
          script: |
            set -e
            cd /root

            if [ ! -d /root/novokray-site-builder ]; then
              git clone https://github.com/TheGusev/novokray-site-builder.git
            fi

            cd /root/novokray-site-builder
            git fetch --all
            git reset --hard origin/main || git reset --hard origin/master

            export BUN_INSTALL="/root/.bun"
            export PATH="/root/.bun/bin:$PATH"

            bun install
            bun run build

            test -f dist/client/index.html
            test -f dist/client/robots.txt
            test -f dist/client/sitemap.xml
            test -f dist/client/docs/dogovor-obrazec.pdf
            test -f dist/client/fonts/PTSans-Regular.ttf
            for m in kompleksnaya-obrabotka obrabotka-ot-tarakanov obrabotka-spalnogo-mesta \
                     obrabotka-uchastka rezultat-klopy-tuman; do
              test -f "dist/client/media/$m.mp4" || { echo "ОШИБКА: нет dist/client/media/$m.mp4"; exit 1; }
              test -f "dist/client/media/$m-poster.webp" || { echo "ОШИБКА: нет постера $m-poster.webp"; exit 1; }
            done
            test -f dist/client/media/uchastok-obrabotka-foto.webp
            test -f server/lead-api.ts
            test -f deploy/lead-api.service
            test -f deploy/lead.env.example

            # Сервис приёма заявок: токен живёт только в /etc/dez-federation/lead.env.
            # Существующий файл деплой не перетирает — значение, вставленное вручную, сохраняется.
            mkdir -p /etc/dez-federation
            if [ ! -f /etc/dez-federation/lead.env ]; then
              umask 077
              cp deploy/lead.env.example /etc/dez-federation/lead.env
              chmod 600 /etc/dez-federation/lead.env
              umask 022
              echo "Создан /etc/dez-federation/lead.env — вставьте TELEGRAM_BOT_TOKEN вручную."
            fi

            # Запасной источник: секрет GitHub подставляется только если токен пуст.
            if ! grep -qE '^TELEGRAM_BOT_TOKEN=.+' /etc/dez-federation/lead.env; then
              if [ -n "${TELEGRAM_BOT_TOKEN:-}" ]; then
                umask 077
                sed -i "s|^TELEGRAM_BOT_TOKEN=.*|TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}|" \
                  /etc/dez-federation/lead.env
                chmod 600 /etc/dez-federation/lead.env
                umask 022
              else
                echo "ОШИБКА: TELEGRAM_BOT_TOKEN пуст — заявки в Telegram уходить не будут."
                echo "Задайте секрет TELEGRAM_BOT_TOKEN в GitHub или вставьте токен"
                echo "в /etc/dez-federation/lead.env и выполните: systemctl restart lead-api"
                exit 1
              fi
            fi

            # Ключ DaData: автозаполнение реквизитов по ИНН на /kp.
            # Отсутствие ключа не блокирует деплой — форма работает в ручном режиме.
            grep -q '^DADATA_API_KEY=' /etc/dez-federation/lead.env \
              || echo 'DADATA_API_KEY=' >> /etc/dez-federation/lead.env
            if ! grep -qE '^DADATA_API_KEY=.+' /etc/dez-federation/lead.env; then
              if [ -n "${DADATA_API_KEY:-}" ]; then
                umask 077
                sed -i "s|^DADATA_API_KEY=.*|DADATA_API_KEY=${DADATA_API_KEY}|" \
                  /etc/dez-federation/lead.env
                chmod 600 /etc/dez-federation/lead.env
                umask 022
              else
                echo "ВНИМАНИЕ: DADATA_API_KEY пуст — реквизиты по ИНН придётся вводить вручную."
                echo "Задайте секрет DADATA_API_KEY в GitHub или впишите ключ"
                echo "в /etc/dez-federation/lead.env и выполните: systemctl restart lead-api"
              fi
            fi

            # Порт 8787 должен быть свободен или занят самим lead-api.
            if ss -tlnp 2>/dev/null | grep -q ':8787 '; then
              if ! ss -tlnp 2>/dev/null | grep ':8787 ' | grep -q 'lead-api\|bun'; then
                echo "ОШИБКА: порт 8787 занят посторонним процессом:"
                ss -tlnp | grep ':8787 '
                exit 1
              fi
            fi

            install -m 644 deploy/lead-api.service /etc/systemd/system/lead-api.service
            systemctl daemon-reload
            systemctl enable lead-api
            systemctl restart lead-api

            for i in $(seq 1 15); do
              curl --fail --silent http://127.0.0.1:8787/health >/dev/null && break
              sleep 1
            done
            health=$(curl --fail --silent http://127.0.0.1:8787/health)
            echo "health: $health"
            echo "$health" | grep -q '"token":true' || {
              echo "ОШИБКА: сервис заявок запущен без токена."
              exit 1
            }

            # Боевая проверка канала: заявка реально уходит в Telegram.
            probe=$(curl --silent --show-error -X POST http://127.0.0.1:8787/api/lead \
              -H 'Content-Type: application/json' \
              -d '{"type":"Деплой: проверка канала","phone":"+70000000000","formName":"deploy-check","name":"Автотест","pest":"Клопы","object":"2-комн. квартира","priceFrom":3500,"priceBasis":"автотест деплоя","page":"https://dez-federation.ru/","device":"сервер","utm":{"utm_source":"deploy"}}')
            echo "probe: $probe"
            echo "$probe" | grep -q '"ok":true' || {
              echo "ОШИБКА: заявка не дошла до Telegram. Логи:"
              journalctl -u lead-api -n 30 --no-pager || true
              exit 1
            }

            # Проверка автозаполнения по ИНН (ИНН самой компании).
            dprobe=$(curl --silent --show-error -X POST http://127.0.0.1:8787/api/dadata \
              -H 'Content-Type: application/json' -d '{"inn":"5410169338"}')
            echo "dadata probe: $dprobe"
            case "$dprobe" in
              *'"ok":true'*) : ;;
              *key_not_configured*)
                echo "ВНИМАНИЕ: DADATA_API_KEY не задан — автозаполнение по ИНН выключено." ;;
              *)
                echo "ОШИБКА: /api/dadata отвечает неверно. Логи:"
                journalctl -u lead-api -n 30 --no-pager || true
                exit 1 ;;
            esac

            release_dir="/var/www/dez-federation-releases/$(date +%Y%m%d%H%M%S)-${GITHUB_SHA:-manual}"
            mkdir -p "$release_dir" /var/www/dez-federation.ru
            cp -a dist/client/. "$release_dir/"

            # Сначала добавляем все файлы новой сборки, затем обновляем HTML.
            # Действующий сайт не очищается и не остаётся пустым между командами.
            rsync -a --exclude='*.html' "$release_dir/" /var/www/dez-federation.ru/
            rsync -a --include='*/' --include='*.html' --exclude='*' "$release_dir/" /var/www/dez-federation.ru/

            systemctl reload nginx

            curl --fail --silent --show-error --resolve dez-federation.ru:443:127.0.0.1 https://dez-federation.ru/ >/dev/null

            # Внешний маршрут: ловит отсутствие location = /api/dadata в nginx.
            ext_dadata=$(curl --silent --show-error --resolve dez-federation.ru:443:127.0.0.1 \
              -X POST https://dez-federation.ru/api/dadata \
              -H 'Content-Type: application/json' -d '{"inn":"5410169338"}' \
              -o /dev/null -w '%{http_code}')
            echo "внешний /api/dadata: $ext_dadata"
            if [ "$ext_dadata" = "404" ] || [ "$ext_dadata" = "405" ]; then
              echo "ОШИБКА: /api/dadata недоступен через nginx — добавьте location = /api/dadata."
              exit 1
            fi
            curl --fail --silent --show-error --resolve dez-federation.ru:443:127.0.0.1 https://dez-federation.ru/blog >/dev/null
            curl --fail --silent --show-error --resolve dez-federation.ru:443:127.0.0.1 https://dez-federation.ru/docs/dogovor-obrazec.pdf >/dev/null

            # Медиа роликов должно отдаваться файлом, а не HTML-заглушкой SPA.
            media_type=$(curl --fail --silent --show-error -o /dev/null -w '%{content_type}' \
              --resolve dez-federation.ru:443:127.0.0.1 https://dez-federation.ru/media/obrabotka-spalnogo-mesta.mp4)
            echo "media content-type: $media_type"
            case "$media_type" in video/*) ;; *) echo "ОШИБКА: /media/*.mp4 не отдаётся (получено $media_type)."; exit 1;; esac

            poster_type=$(curl --fail --silent --show-error -o /dev/null -w '%{content_type}' \
              --resolve dez-federation.ru:443:127.0.0.1 https://dez-federation.ru/media/obrabotka-spalnogo-mesta-poster.webp)
            echo "poster content-type: $poster_type"
            case "$poster_type" in image/webp*) ;; *) echo "ОШИБКА: постер отдаётся как $poster_type, ожидался image/webp."; exit 1;; esac

            # Range-запрос: без 206 видео не стартует в iOS Safari и не перематывается.
            range_code=$(curl --silent --show-error -o /dev/null -w '%{http_code}' -H 'Range: bytes=0-1' \
              --resolve dez-federation.ru:443:127.0.0.1 https://dez-federation.ru/media/obrabotka-spalnogo-mesta.mp4)
            echo "media range code: $range_code"
            [ "$range_code" = "206" ] || { echo "ОШИБКА: Range-запрос к /media/*.mp4 вернул $range_code вместо 206."; exit 1; }

            # Отсутствующий файл обязан быть 404, а не HTML главной страницы.
            missing_code=$(curl --silent --show-error -o /dev/null -w '%{http_code}' \
              --resolve dez-federation.ru:443:127.0.0.1 https://dez-federation.ru/media/nope.mp4)
            echo "media missing code: $missing_code"
            [ "$missing_code" = "404" ] || { echo "ОШИБКА: /media/nope.mp4 вернул $missing_code — добавьте location ^~ /media/ с try_files \$uri =404."; exit 1; }

            # Внешний маршрут: ловит отсутствие location = /api/lead в nginx.
            nginx_probe=$(curl --silent --show-error --resolve dez-federation.ru:443:127.0.0.1 \
              -X POST https://dez-federation.ru/api/lead \
              -H 'Content-Type: application/json' \
              -d '{"type":"Деплой: проверка канала","phone":"+70000000000","formName":"deploy-check","name":"Автотест","pest":"Клопы","object":"2-комн. квартира","priceFrom":3500,"priceBasis":"автотест деплоя","page":"https://dez-federation.ru/","device":"сервер","utm":{"utm_source":"deploy"}}')
            echo "nginx probe: $nginx_probe"
            echo "$nginx_probe" | grep -q '"ok":true' || {
              echo "ОШИБКА: /api/lead недоступен через nginx — добавьте location = /api/lead."
              exit 1
            }

            # Удаление устаревших файлов выполняется только после успешной проверки.
            # Старые хешированные assets сохраняем: открытая до деплоя вкладка может ещё запросить их.
            rsync -a --delete-after --exclude='assets/' "$release_dir/" /var/www/dez-federation.ru/
            find /var/www/dez-federation-releases -mindepth 1 -maxdepth 1 -type d -mtime +7 -exec rm -rf {} +
