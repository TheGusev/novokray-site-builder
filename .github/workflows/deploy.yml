name: Deploy dez-federation

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DADATA_API_KEY: ${{ secrets.DADATA_API_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TELEGRAM_BOT_TOKEN,DADATA_API_KEY
          script: |
            set -e
            cd /root

            if [ ! -d /root/novokray-site-builder ]; then
              git clone https://github.com/TheGusev/novokray-site-builder.git
            fi

            cd /root/novokray-site-builder
            git fetch --all
            git reset --hard origin/main || git reset --hard origin/master

            export BUN_INSTALL="/root/.bun"
            export PATH="/root/.bun/bin:$PATH"

            bun install
            # STATIC_EXPORT=1 — пререндер всех страниц в HTML для nginx.
            STATIC_EXPORT=1 bun run build

            test -f dist/client/index.html
            test -f dist/client/robots.txt
            test -f dist/client/sitemap.xml
            test -f dist/client/docs/dogovor-obrazec.pdf
            test -f dist/client/fonts/PTSans-Regular.ttf
            for m in kompleksnaya-obrabotka obrabotka-ot-tarakanov obrabotka-spalnogo-mesta \
                     obrabotka-uchastka rezultat-klopy-tuman; do
              test -f "dist/client/media/$m.mp4" || { echo "ОШИБКА: нет dist/client/media/$m.mp4"; exit 1; }
              test -f "dist/client/media/$m-poster.webp" || { echo "ОШИБКА: нет постера $m-poster.webp"; exit 1; }
            done
            test -f dist/client/media/uchastok-obrabotka-foto.webp
            test -f server/lead-api.ts
            test -f deploy/lead-api.service
            test -f deploy/lead.env.example

            # Флаг проблем: проверки сервисов не должны мешать выкладке сайта.
            deploy_warnings=0
            site_ok=нет
            tg_ok=нет
            dadata_ok=нет
            fail() { echo "ОШИБКА: $*"; deploy_warnings=1; }
            svc_logs() { journalctl -u lead-api -n 30 --no-pager || true; }

            # 1. ВЫКЛАДКА САЙТА — раньше всех проверок сервисов.
            release_dir="/var/www/dez-federation-releases/$(date +%Y%m%d%H%M%S)-${GITHUB_SHA:-manual}"
            mkdir -p "$release_dir" /var/www/dez-federation.ru
            cp -a dist/client/. "$release_dir/"

            # Сначала добавляем все файлы новой сборки, затем обновляем HTML.
            # Действующий сайт не очищается и не остаётся пустым между командами.
            rsync -a --exclude='*.html' "$release_dir/" /var/www/dez-federation.ru/
            rsync -a --include='*/' --include='*.html' --exclude='*' "$release_dir/" /var/www/dez-federation.ru/

            systemctl reload nginx || fail "nginx не перезагрузился."

            if curl --fail --silent --show-error --resolve dez-federation.ru:443:127.0.0.1 https://dez-federation.ru/ >/dev/null; then
              site_ok=да
              # Удаление устаревших файлов — только после успешной проверки главной.
              # Старые хешированные assets сохраняем: открытая до деплоя вкладка может ещё запросить их.
              rsync -a --delete-after --exclude='assets/' "$release_dir/" /var/www/dez-federation.ru/
              find /var/www/dez-federation-releases -mindepth 1 -maxdepth 1 -type d -mtime +7 -exec rm -rf {} +
            else
              fail "главная страница не отвечает после выкладки."
            fi

            for p in /blog /docs/dogovor-obrazec.pdf; do
              curl --fail --silent --show-error --resolve dez-federation.ru:443:127.0.0.1 "https://dez-federation.ru$p" >/dev/null \
                || fail "страница $p не отвечает."
            done

            # 2. МЕДИА: ролики должны отдаваться файлом, а не HTML-заглушкой SPA.
            media_type=$(curl --silent --show-error -o /dev/null -w '%{content_type}' \
              --resolve dez-federation.ru:443:127.0.0.1 https://dez-federation.ru/media/obrabotka-spalnogo-mesta.mp4 || true)
            echo "media content-type: $media_type"
            case "$media_type" in video/*) ;; *) fail "/media/*.mp4 не отдаётся (получено $media_type).";; esac

            poster_type=$(curl --silent --show-error -o /dev/null -w '%{content_type}' \
              --resolve dez-federation.ru:443:127.0.0.1 https://dez-federation.ru/media/obrabotka-spalnogo-mesta-poster.webp || true)
            echo "poster content-type: $poster_type"
            case "$poster_type" in image/webp*) ;; *) fail "постер отдаётся как $poster_type, ожидался image/webp.";; esac

            # Range-запрос: без 206 видео не стартует в iOS Safari и не перематывается.
            range_code=$(curl --silent --show-error -o /dev/null -w '%{http_code}' -H 'Range: bytes=0-1' \
              --resolve dez-federation.ru:443:127.0.0.1 https://dez-federation.ru/media/obrabotka-spalnogo-mesta.mp4 || true)
            echo "media range code: $range_code"
            [ "$range_code" = "206" ] || fail "Range-запрос к /media/*.mp4 вернул $range_code вместо 206."

            # 2.1 КАНОНИЗАЦИЯ URL. Один адрес страницы — без слэша и без index.html,
            # ровно так, как указано в <link rel="canonical"> и в sitemap.
            canon_note="уже настроена"
            canon_conf=$(grep -rlE 'server_name[^;]*dez-federation\.ru' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | head -n1 || true)
            if [ -z "$canon_conf" ]; then
              canon_note="конфиг сайта не найден"
              fail "не найден конфиг nginx с server_name dez-federation.ru — канонизацию URL добавьте вручную."
            elif grep -q 'canonical-url-normalization' "$canon_conf"; then
              :
            else
              cp "$canon_conf" "$canon_conf.bak-canon-$(date +%Y%m%d%H%M%S)"
              # try_files с $uri/ заставляет nginx самому редиректить на слэш — получился бы цикл.
              sed -i 's|try_files \$uri \$uri/ /index.html|try_files $uri $uri.html $uri/index.html /index.html|g' "$canon_conf"
              awk '
                !done && $0 ~ /^[ \t]*location[ \t]+\/[ \t]*\{/ {
                  print "    # canonical-url-normalization (managed by deploy)";
                  print "    if ($request_uri ~ ^/index\\.html(\\?|$)) { return 301 /$is_args$args; }";
                  print "    if ($request_uri ~ ^(?<nosl_i>/.+)/index\\.html(\\?|$)) { return 301 $nosl_i$is_args$args; }";
                  print "    if ($request_uri ~ ^(?<nosl>/.+)/(\\?|$)) { return 301 $nosl$is_args$args; }";
                  print "";
                  done = 1;
                }
                { print }
                END { if (!done) exit 3 }
              ' "$canon_conf" > /tmp/ngx.canon && mv /tmp/ngx.canon "$canon_conf" \
                || { rm -f /tmp/ngx.canon; canon_note="нужна ручная настройка"; fail "в конфиге nginx нет location / — канонизацию URL добавьте вручную."; }
              if [ "$canon_note" = "нужна ручная настройка" ]; then
                :
              elif nginx -t 2>&1; then
                systemctl reload nginx || fail "nginx не перезагрузился после канонизации URL."
                canon_note="настроена автоматически"
              else
                cp "$(ls -t "$canon_conf".bak-canon-* | head -n1)" "$canon_conf"
                canon_note="автонастройка не удалась, конфиг возвращён"
                fail "не удалось настроить канонизацию URL автоматически — см. SERVER_DEPLOYMENT.md."
              fi
            fi
            echo "nginx канонизация URL: $canon_note"

            # Проверка: /price/ и /price/index.html обязаны 301-редиректить на /price без цепочек.
            for probe in /price/ /price/index.html; do
              redir=$(curl --silent --show-error -o /dev/null -w '%{http_code} %{redirect_url}' \
                --resolve dez-federation.ru:443:127.0.0.1 "https://dez-federation.ru$probe" || true)
              echo "canonical $probe -> $redir"
              case "$redir" in
                "301 https://dez-federation.ru/price") ;;
                *) fail "$probe отдал «$redir», ожидался 301 на https://dez-federation.ru/price." ;;
              esac
            done

            # Канонический URL обязан отвечать 200 без редиректа (иначе цикл).
            for probe in / /price /video /blog /services /faq /kp; do
              code=$(curl --silent --show-error -o /dev/null -w '%{http_code}' \
                --resolve dez-federation.ru:443:127.0.0.1 "https://dez-federation.ru$probe" || true)
              echo "canonical 200-check $probe -> $code"
              [ "$code" = "200" ] || fail "$probe вернул $code вместо 200 — проверьте канонизацию URL в nginx."
            done

            # Отсутствующий файл обязан быть 404, а не HTML главной страницы.
            missing_code=$(curl --silent --show-error -o /dev/null -w '%{http_code}' \
              --resolve dez-federation.ru:443:127.0.0.1 https://dez-federation.ru/media/nope.mp4 || true)
            echo "media missing code: $missing_code"
            [ "$missing_code" = "404" ] || fail "/media/nope.mp4 вернул $missing_code — добавьте location ^~ /media/ с try_files \$uri =404."

            # 3. СЕРВИС ЗАЯВОК. Токен живёт только в /etc/dez-federation/lead.env.
            # Существующий файл деплой не перетирает — значение, вставленное вручную, сохраняется.
            mkdir -p /etc/dez-federation
            if [ ! -f /etc/dez-federation/lead.env ]; then
              umask 077
              cp deploy/lead.env.example /etc/dez-federation/lead.env
              chmod 600 /etc/dez-federation/lead.env
              umask 022
              echo "Создан /etc/dez-federation/lead.env — вставьте TELEGRAM_BOT_TOKEN вручную."
            fi

            # Секрет GitHub — основной источник: если он задан, файл синхронизируется с ним.
            token_ready=1
            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ]; then
              if ! grep -qxF "TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}" /etc/dez-federation/lead.env; then
                umask 077
                grep -q '^TELEGRAM_BOT_TOKEN=' /etc/dez-federation/lead.env \
                  || echo 'TELEGRAM_BOT_TOKEN=' >> /etc/dez-federation/lead.env
                sed -i "s|^TELEGRAM_BOT_TOKEN=.*|TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}|" \
                  /etc/dez-federation/lead.env
                chmod 600 /etc/dez-federation/lead.env
                umask 022
                echo "Токен бота обновлён из секрета GitHub."
              fi
            elif ! grep -qE '^TELEGRAM_BOT_TOKEN=.+' /etc/dez-federation/lead.env; then
              token_ready=0
              fail "TELEGRAM_BOT_TOKEN пуст — заявки в Telegram уходить не будут. Задайте секрет TELEGRAM_BOT_TOKEN в GitHub."
            fi

            # chat id и порт должны быть заданы явно.
            grep -q '^TELEGRAM_CHAT_ID=' /etc/dez-federation/lead.env \
              || echo 'TELEGRAM_CHAT_ID=-5244841627' >> /etc/dez-federation/lead.env
            grep -q '^LEAD_API_PORT=' /etc/dez-federation/lead.env \
              || echo 'LEAD_API_PORT=8787' >> /etc/dez-federation/lead.env
            chmod 600 /etc/dez-federation/lead.env

            # Журнал заявок: сервис пишет туда каждую заявку до отправки в Telegram.
            mkdir -p /var/log/dez-federation
            chmod 700 /var/log/dez-federation

            # nginx: без проксирования /api/(lead|dadata) формы не работают. Ставим блок сами.
            nginx_note="уже настроен"
            ngx_conf=$(grep -rlE 'server_name[^;]*dez-federation\.ru' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | head -n1 || true)
            if [ -z "$ngx_conf" ]; then
              nginx_note="конфиг сайта не найден"
              fail "не найден конфиг nginx с server_name dez-federation.ru — добавьте проксирование /api/lead вручную."
            elif grep -q 'api/(lead|dadata)' "$ngx_conf"; then
              :
            else
              cp "$ngx_conf" "$ngx_conf.bak-$(date +%Y%m%d%H%M%S)"
              # Вставляем regex-блок перед первым `location /` в конфиге сайта.
              awk '
                !done && $0 ~ /^[ \t]*location[ \t]+\/[ \t]*\{/ {
                  print "    location ~ ^/api/(lead|dadata)$ {";
                  print "        proxy_pass http://127.0.0.1:8787;";
                  print "        proxy_http_version 1.1;";
                  print "        proxy_set_header Host $host;";
                  print "        proxy_set_header X-Real-IP $remote_addr;";
                  print "        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;";
                  print "        proxy_read_timeout 20s;";
                  print "    }";
                  print "";
                  done = 1;
                }
                { print }
                END { if (!done) exit 3 }
              ' "$ngx_conf" > /tmp/ngx.new && mv /tmp/ngx.new "$ngx_conf" \
                && echo "вставлен блок проксирования /api/(lead|dadata)" \
                || { rm -f /tmp/ngx.new; nginx_note="нужна ручная настройка"; fail "в конфиге nginx нет location / — блок проксирования /api/lead добавьте вручную."; }
              if [ "$nginx_note" = "нужна ручная настройка" ]; then
                :
              elif nginx -t 2>&1; then
                systemctl reload nginx || fail "nginx не перезагрузился."
                nginx_note="настроен автоматически"
              else
                cp "$(ls -t "$ngx_conf".bak-* | head -n1)" "$ngx_conf"
                nginx_note="автонастройка не удалась, конфиг возвращён"
                fail "не удалось настроить nginx автоматически — блок проксирования /api/lead нужно добавить вручную."
              fi
            fi
            echo "nginx /api/lead: $nginx_note"

            # Ключ DaData: автозаполнение реквизитов по ИНН на /kp.
            grep -q '^DADATA_API_KEY=' /etc/dez-federation/lead.env \
              || echo 'DADATA_API_KEY=' >> /etc/dez-federation/lead.env
            if ! grep -qE '^DADATA_API_KEY=.+' /etc/dez-federation/lead.env; then
              if [ -n "${DADATA_API_KEY:-}" ]; then
                umask 077
                sed -i "s|^DADATA_API_KEY=.*|DADATA_API_KEY=${DADATA_API_KEY}|" \
                  /etc/dez-federation/lead.env
                chmod 600 /etc/dez-federation/lead.env
                umask 022
              else
                echo "ВНИМАНИЕ: DADATA_API_KEY пуст — реквизиты по ИНН придётся вводить вручную."
              fi
            fi

            # Порт 8787 должен быть свободен или занят самим lead-api.
            port_busy=0
            if ss -tlnp 2>/dev/null | grep -q ':8787 '; then
              if ! ss -tlnp 2>/dev/null | grep ':8787 ' | grep -q 'lead-api\|bun'; then
                port_busy=1
                echo "Порт 8787 занят посторонним процессом:"
                ss -tlnp | grep ':8787 ' || true
                fail "порт 8787 занят посторонним процессом — сервис заявок не перезапущен."
              fi
            fi

            if [ "$port_busy" = "0" ]; then
              install -m 644 deploy/lead-api.service /etc/systemd/system/lead-api.service
              systemctl daemon-reload || fail "systemctl daemon-reload не выполнен."
              systemctl enable lead-api || fail "не удалось включить автозапуск lead-api."
              systemctl restart lead-api || { fail "сервис lead-api не перезапустился."; svc_logs; }

              for i in $(seq 1 15); do
                curl --fail --silent http://127.0.0.1:8787/health >/dev/null && break
                sleep 1
              done
              health=$(curl --fail --silent http://127.0.0.1:8787/health || true)
              echo "health: $health"
              case "$health" in
                *'"token":true'*) : ;;
                "") fail "сервис заявок не отвечает на /health."; svc_logs ;;
                *) if [ "$token_ready" = "1" ]; then fail "сервис заявок запущен без токена."; svc_logs; fi ;;
              esac

              # Боевая проверка канала: заявка реально уходит в Telegram.
              probe=$(curl --silent --show-error -X POST http://127.0.0.1:8787/api/lead \
                -H 'Content-Type: application/json' \
                -d '{"type":"Деплой: проверка канала","phone":"+70000000000","formName":"deploy-check","name":"Автотест","pest":"Клопы","object":"2-комн. квартира","priceFrom":3500,"priceBasis":"автотест деплоя","page":"https://dez-federation.ru/","device":"сервер","utm":{"utm_source":"deploy"}}' || true)
              echo "probe: $probe"
              case "$probe" in
                *'"ok":true'*) : ;;
                *) fail "заявка не дошла до Telegram."; svc_logs ;;
              esac

              # Проверка автозаполнения по ИНН (ИНН самой компании).
              dprobe=$(curl --silent --show-error -X POST http://127.0.0.1:8787/api/dadata \
                -H 'Content-Type: application/json' -d '{"inn":"5410169338"}' || true)
              echo "dadata probe: $dprobe"
              case "$dprobe" in
                *'"ok":true'*) dadata_ok=да ;;
                *key_not_configured*)
                  echo "ВНИМАНИЕ: DADATA_API_KEY не задан — автозаполнение по ИНН выключено." ;;
                *) fail "/api/dadata отвечает неверно."; svc_logs ;;
              esac
            fi

            # 4. ВНЕШНИЕ МАРШРУТЫ ЧЕРЕЗ NGINX.
            ext_dadata=$(curl --silent --show-error --resolve dez-federation.ru:443:127.0.0.1 \
              -X POST https://dez-federation.ru/api/dadata \
              -H 'Content-Type: application/json' -d '{"inn":"5410169338"}' \
              -o /dev/null -w '%{http_code}' || true)
            echo "внешний /api/dadata: $ext_dadata"
            case "$ext_dadata" in
              404|405) fail "/api/dadata недоступен через nginx — добавьте location = /api/dadata." ;;
            esac

            nginx_probe=$(curl --silent --show-error --resolve dez-federation.ru:443:127.0.0.1 \
              -X POST https://dez-federation.ru/api/lead \
              -H 'Content-Type: application/json' \
              -d '{"type":"Деплой: проверка канала","phone":"+70000000000","formName":"deploy-check","name":"Автотест","pest":"Клопы","object":"2-комн. квартира","priceFrom":3500,"priceBasis":"автотест деплоя","page":"https://dez-federation.ru/","device":"сервер","utm":{"utm_source":"deploy"}}' || true)
            echo "nginx probe: $nginx_probe"
            case "$nginx_probe" in
              *'"ok":true'*) tg_ok=да ;;
              *) fail "/api/lead недоступен через nginx — добавьте location = /api/lead." ;;
            esac

            # 5. СВОДКА.
            echo "=============================="
            echo "ИТОГ ДЕПЛОЯ"
            echo "Сайт обновлён:        $site_ok"
            echo "Токен бота:           $([ "$token_ready" = "1" ] && echo есть || echo нет)"
            echo "nginx /api/lead:      $nginx_note"
            echo "Заявки в Telegram:    $tg_ok"
            echo "Автозаполнение ИНН:   $dadata_ok"
            echo "Версия:               ${GITHUB_SHA:-manual}"
            echo "Каталог релиза:       $release_dir"
            echo "=============================="

            if [ "$deploy_warnings" != "0" ]; then
              echo "Часть проверок не прошла — смотрите строки «ОШИБКА:» выше."
            fi

            # Деплой считается неудачным только если сам сайт не выложился.
            if [ "$site_ok" != "да" ]; then
              echo "Сайт не отвечает после выкладки — деплой провален."
              exit 1
            fi
            echo "Сайт выложен успешно."
